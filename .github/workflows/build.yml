name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate missing platform folders
        run: flutter create --platforms=android --project-name=uzum_tezkor_customer .

      - name: Bump Android compileSdk/targetSdk
        run: |
          sed -i 's/compileSdk[[:space:]]*=.*/compileSdk = 36/' android/app/build.gradle.kts || true
          sed -i 's/targetSdk[[:space:]]*=.*/targetSdk = 36/' android/app/build.gradle.kts || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 36/' android/app/build.gradle || true
          echo "--- build.gradle.kts contents ---"
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uzum-tezkor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
