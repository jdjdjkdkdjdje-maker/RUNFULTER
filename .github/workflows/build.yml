name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'

      - name: Generate missing platform folders
        run: flutter create --platforms=android --project-name=uzum_tezkor_customer .

      - name: Force Android SDK 36 globally
        run: |
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
          sed -i '/compileSdk[[:space:]]*=/d' android/app/build.gradle.kts
          sed -i '/^android {/a\    compileSdk = 36' android/app/build.gradle.kts
          sed -i '/targetSdk[[:space:]]*=/d' android/app/build.gradle.kts
          sed -i '/defaultConfig {/a\        targetSdk = 36' android/app/build.gradle.kts
          echo "---- local.properties ----"
          cat android/local.properties
          echo "---- build.gradle.kts ----"
          cat android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uzum-tezkor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
